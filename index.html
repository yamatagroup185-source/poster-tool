<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポスター・フライヤー報告 抽出・転記ツール</title>
<style>
  :root {
    --bg: #f6f4ee;
    --panel: #ffffff;
    --ink: #26261f;
    --ink-soft: #6b6a5e;
    --line: #dedad0;
    --accent: #3b6e52;
    --accent-soft: #e6efe8;
    --sheets: #0f9d58;
    --sheets-soft: #e8f5e9;
    --mono: "SFMono-Regular", Consolas, monospace;
    --serif: "Shippori Mincho", serif;
    --sans: "Zen Kaku Gothic New", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1c17;
      --panel: #242520;
      --ink: #eeece2;
      --ink-soft: #a5a394;
      --line: #3a3b32;
      --accent: #7fb996;
      --accent-soft: #2a352c;
      --sheets: #81c784;
      --sheets-soft: #1b3320;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0;
    line-height: 1.7;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 80px; }
  header { margin-bottom: 24px; }
  h1 { font-family: var(--serif); font-size: clamp(22px, 4vw, 28px); font-weight: 600; margin: 0 0 8px; }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  label.field-label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; font-weight: 600; }
  input[type="text"], textarea {
    width: 100%;
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
  }
  textarea { min-height: 160px; resize: vertical; font-family: var(--mono); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  button.primary {
    background: var(--accent); color: var(--panel); border: none; border-radius: 7px;
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.send-sheets {
    background: #0f9d58; color: #ffffff; border: none; border-radius: 7px;
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 7px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th { color: var(--ink-soft); font-weight: 600; font-size: 12px; }
  td.date { white-space: nowrap; color: var(--ink-soft); font-size: 13px; }
  .status { display: inline-block; padding: 2px 9px; border-radius: 100px; font-size: 12px; }
  .status.ok { background: var(--accent-soft); color: var(--accent); }
  .status.pending { background: #f5e8dd; color: #a8622f; }
  .status.info { background: var(--line); color: var(--ink-soft); }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--ink); color: var(--bg); padding: 9px 18px; border-radius: 100px;
    font-size: 13px; opacity: 0; transition: 0.2s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ポスター・フライヤー報告 抽出・転記ツール</h1>
    <p class="sub">トーク履歴やメモから抽出し、Googleスプレッドシートへ直接転記できます。</p>
  </header>

  <details class="panel" style="margin-bottom: 16px;">
    <summary style="font-size:13px; color:var(--ink-soft); cursor:pointer;">⚙️ スプレッドシート連携URLの設定（最初の一回だけ設定）</summary>
    <div style="margin-top: 12px;">
      <label class="field-label" for="gasUrl">Google Apps ScriptのWebアプリURL</label>
      <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec">
      <button class="ghost" id="saveUrl" style="margin-top:8px;">URLを保存</button>
    </div>
  </details>

  <div class="panel">
    <label class="field-label" for="input">テキストを貼り付けて抽出</label>
    <textarea id="input" placeholder="【入力例】&#10;9/22 むらおか ポスター設置ヤマタ本社&#10;9/23 谷口 チラシ50枚 配布完了"></textarea>
    <div class="row">
      <button class="primary" id="extract">抽出して一覧化</button>
    </div>
  </div>

  <div class="panel" id="resultPanel" style="display:none;">
    <div class="row" style="justify-content: space-between; margin-top:0; width:100%;">
      <span style="font-size:13px; color:var(--ink-soft);" id="count"></span>
      <button class="send-sheets" id="sendToSheets">📊 スプレッドシートへ送信</button>
    </div>
    <div style="overflow-x: auto; margin-top: 12px;">
      <table>
        <thead>
          <tr><th>日付</th><th>報告者</th><th>内容</th><th>判定</th></tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const keywordRe = /(ポスター|フライヤー|チラシ|設置|配布|掲示)/i;
  const okRe = /(オッケー|OK|ok|Ok|完了|設置|貼|承諾|許可|いただきました|済み)/;
  const pendingRe = /(交渉中|打診|検討|確認中|未定|依頼中|お願い)/;

  let currentExtractedRows = [];

  // 保存済みのURLを読み込み
  const savedUrl = localStorage.getItem('poster_tool_gas_url') || '';
  if (savedUrl) document.getElementById('gasUrl').value = savedUrl;

  document.getElementById('saveUrl').addEventListener('click', function() {
    const url = document.getElementById('gasUrl').value.trim();
    localStorage.setItem('poster_tool_gas_url', url);
    showToast('連携URLを保存しました');
  });

  function classify(text) {
    if (okRe.test(text) && !pendingRe.test(text)) return { label: 'OK系', cls: 'ok' };
    if (pendingRe.test(text)) return { label: '交渉/確認中', cls: 'pending' };
    return { label: '要確認', cls: 'info' };
  }

  function parseText(raw) {
    const lines = raw.split(/\r?\n/);
    const results = [];
    let currentDate = '日付不明';
    let currentWho = '不明';

    const dateReHeader = /^(\d{4}\/\d{1,2}\/\d{1,2}|\d{1,2}月\d{1,2}日)/;
    const msgStartRe = /^(\d{1,2}:\d{2})\t([^\t]+)\t(.*)$/;

    for (let rawLine of lines) {
      let line = rawLine.replace(/[\u2068\u2069]/g, '').trim();
      if (!line) continue;

      const dh = line.match(dateReHeader);
      if (dh) { currentDate = dh[1]; }

      const mm = line.match(msgStartRe);
      if (mm) {
        currentWho = mm[2].trim();
        const content = mm[3];
        if (keywordRe.test(content)) {
          results.push({ date: currentDate, who: currentWho, text: content });
        }
        continue;
      }

      if (keywordRe.test(line)) {
        let date = currentDate;
        let who = currentWho;
        let content = line;

        const inlineDate = line.match(/(\d{1,2}[\/月]\d{1,2}日?)/);
        if (inlineDate) {
          date = inlineDate[1];
          content = content.replace(inlineDate[0], '').trim();
        }

        const spaceParts = content.split(/[\s ]+/);
        if (spaceParts.length > 1) {
          who = spaceParts[0];
          content = spaceParts.slice(1).join(' ');
        }

        results.push({
          date: date !== '日付不明' ? date : '随時',
          who: who !== '不明' ? who : '担当者',
          text: content || line
        });
      }
    }
    return results;
  }

  function render(rows) {
    currentExtractedRows = rows;
    const panel = document.getElementById('resultPanel');
    const body = document.getElementById('resultBody');
    const count = document.getElementById('count');
    panel.style.display = 'block';
    body.innerHTML = '';

    count.textContent = rows.length + '件 抽出完了';

    for (const r of rows) {
      const status = classify(r.text);
      r.statusLabel = status.label;
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="date">' + r.date + '</td>' +
        '<td>' + r.who + '</td>' +
        '<td>' + r.text + '</td>' +
        '<td><span class="status ' + status.cls + '">' + status.label + '</span></td>';
      body.appendChild(tr);
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  document.getElementById('extract').addEventListener('click', function () {
    const raw = document.getElementById('input').value;
    if (!raw.trim()) { showToast('テキストを入力してください'); return; }
    render(parseText(raw));
  });

  document.getElementById('sendToSheets').addEventListener('click', function () {
    const url = localStorage.getItem('poster_tool_gas_url');
    if (!url) {
      alert('設定エリアを開いて「Google Apps ScriptのWebアプリURL」を入力・保存してください。');
      return;
    }

    const payload = currentExtractedRows.map(r => ({
      date: r.date,
      who: r.who,
      text: r.text,
      status: r.statusLabel
    }));

    const btn = document.getElementById('sendToSheets');
    btn.disabled = true;
    btn.textContent = '送信中...';

    fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(() => {
      showToast('スプレッドシートへ送信完了！');
      document.getElementById('input').value = '';
      document.getElementById('resultPanel').style.display = 'none';
      btn.disabled = false;
      btn.textContent = '📊 スプレッドシートへ送信';
    }).catch(err => {
      alert('送信に失敗しました。URLを確認してください。');
      btn.disabled = false;
      btn.textContent = '📊 スプレッドシートへ送信';
    });
  });
})();
</script>
</body>
</html>
